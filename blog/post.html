<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artikel | Marktanalyse Blog</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">

    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition">
                <i class="fa-solid fa-arrow-left mr-1"></i>Alle artikelen
            </a>
            <a href="../trading_dashboard.html" class="text-xs text-slate-400 hover:text-white transition">
                Dashboard <i class="fa-solid fa-gauge ml-1"></i>
            </a>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-8">
        <article id="articleContent">
            <div class="text-slate-500 text-sm">Laden...</div>
        </article>
    </main>

    <script>
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        async function loadPost() {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');
            const container = document.getElementById('articleContent');

            if (!slug) {
                container.innerHTML = '<p class="text-slate-500">Geen artikel opgegeven.</p>';
                return;
            }

            try {
                const res = await fetch(`posts/${encodeURIComponent(slug)}.json`, { cache: 'no-store' });
                if (!res.ok) throw new Error('Artikel niet gevonden');
                const post = await res.json();

                document.title = post.title + ' | Marktanalyse Blog';

                const bodyHtml = (post.body || '')
                    .split('\n\n')
                    .map(p => `<p class="mb-4 leading-relaxed text-slate-300">${escapeHtml(p)}</p>`)
                    .join('');

                container.innerHTML = `
                    <div class="text-xs text-slate-500 mb-2">${new Date(post.date).toLocaleString('nl-NL')}</div>
                    <h1 class="text-2xl font-bold text-white mb-6">${escapeHtml(post.title)}</h1>
                    <div class="text-base">${bodyHtml}</div>
                    <div class="mt-8 pt-4 border-t border-slate-800 text-xs text-slate-500 flex items-start gap-2">
                        <i class="fa-solid fa-robot mt-0.5 text-violet-400"></i>
                        <span>${escapeHtml(post.disclaimer || 'Automatisch gegenereerde AI-analyse, geen financieel advies.')}</span>
                    </div>
                `;
            } catch (e) {
                console.error(e);
                container.innerHTML = '<p class="text-slate-500">Kon dit artikel niet laden.</p>';
            }
        }

        loadPost();
    </script>
</body>
</html>
